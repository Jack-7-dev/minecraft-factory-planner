org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.auto-download=false

# Gradle itself must run on a JDK it supports. This machine's default `java` is 25, which
# Gradle 8.14 rejects ("Unsupported class file major version 69"), and Forge dev runs are
# happiest on 17 anyway. Change this path if you build elsewhere.
org.gradle.java.home=C:/Program Files/Java/jdk-17

# Platform
    minecraft_version=1.20.1
    forge_version=47.3.10
    parchment_minecraft=1.20.1
    parchment_version=2023.09.03
    moddevgradle_version=2.0.141

# Mod
    mod_id=mfp
    mod_name=Minecraft Factory Planner
    mod_version=0.3.0
    mod_group=dev.mfp
    mod_license=MIT
    mod_authors=jackb
    mod_description=Plan GregTech production chains: machines, tiers, EU/t and throughput.

# Integration targets
# GregTech Modern - StarT Fork. Not available from any public maven any more, so it is built
# from the sibling checkout:  cd ../GTM-StarT-Fork && ./gradlew publishToMavenLocal
    gtceu_version=1.7.0b
    ldlib_version=1.0.40.b
    registrate_version=MC1.20-1.3.11
    configuration_version=2.2.0
    kubejs_version=2001.6.5-build.16

# Optional recipe-viewer integration (EMI provider, post-v1)
    emi_version=1.1.13
    jei_version=15.20.0.115
